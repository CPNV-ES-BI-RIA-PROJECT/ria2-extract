# The .env loader will set these as system properties
spring.application.name=${SPRING_APPLICATION_NAME:extractorservice}
server.port=${SERVER_PORT:8080}

# Logging configuration
logging.level.com.example=DEBUG
logging.level.root=INFO

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:}
mqtt.namespace=${MQTT_NAMESPACE:stack1}
mqtt.service-name=${MQTT_SERVICE_NAME:extract}
mqtt.client-id=${MQTT_CLIENT_ID:}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.qos=${MQTT_QOS:1}
