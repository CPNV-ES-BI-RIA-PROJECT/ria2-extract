services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ${MQTT_CONTAINER_NAME:-extractor-mosquitto}
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  bucket-adapter:
    build:
      context: .
    image: ${IMAGE_NAME:-ria2-extractor-service:latest}
    depends_on:
      - mosquitto
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS_CONTAINER:-/gcp-credentials.json}
      AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE_CONTAINER:-/.aws/credentials}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL_CONTAINER:-tcp://mosquitto:1883}
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./gcp-credentials.json}:${GOOGLE_APPLICATION_CREDENTIALS_CONTAINER:-/gcp-credentials.json}:ro
      - ${AWS_SHARED_CREDENTIALS_FILE:-${HOME}/.aws/credentials}:${AWS_SHARED_CREDENTIALS_FILE_CONTAINER:-/.aws/credentials}:ro
    restart: unless-stopped
